<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER | Spatial Transfer Protocol</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon: #00f2ff;
            --neon-dim: rgba(0, 242, 255, 0.3);
            --bg: #030303;
            --error: #ff3e3e;
            --font-main: 'Share Tech Mono', monospace;
            --hand-x: 50%;
            --hand-y: 50%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* --- Sci-Fi Setup Screen --- */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a1a1a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .hud-card {
            border: 1px solid var(--neon-dim);
            padding: 40px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .hud-card::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; width: 20px; height: 20px;
            border-top: 2px solid var(--neon); border-left: 2px solid var(--neon);
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 12px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--neon);
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--neon-dim);
            color: var(--neon);
            padding: 12px;
            margin-bottom: 15px;
            font-family: inherit;
            text-align: center;
            outline: none;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 15px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 20px var(--neon);
        }

        /* --- HUD Interface --- */
        #main-interface {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #video-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: grayscale(1) contrast(1.5) brightness(0.7) sepia(1) hue-rotate(140deg);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 5;
            opacity: 0.6;
        }

        .overlay-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            border: 20px solid transparent;
            border-image: radial-gradient(circle, transparent 70%, rgba(0, 242, 255, 0.05) 100%) 20;
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 242, 255, 0.1);
            top: 0;
            animation: scanning 4s linear infinite;
        }

        @keyframes scanning {
            0% { top: 0%; } 100% { top: 100%; }
        }

        /* --- Transfer Object --- */
        .payload-wrapper {
            position: absolute;
            left: var(--hand-x);
            top: var(--hand-y);
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
        }

        #payload-img {
            width: 220px;
            height: 300px;
            object-fit: cover;
            border: 1px solid var(--neon);
            box-shadow: 0 0 30px var(--neon-dim);
            display: none;
        }

        /* --- Materialize Animation --- */
        .animate-drop {
            display: block !important;
            animation: materialize 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }

        @keyframes materialize {
            0% { transform: scale(0) rotateX(90deg); opacity: 0; filter: brightness(5) blur(20px); }
            100% { transform: scale(1) rotateX(0deg); opacity: 1; filter: brightness(1) blur(0px); }
        }

        .status-tag {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 5px 20px;
            border: 1px solid var(--neon-dim);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="hud-card">
            <h1>AETHER</h1>
            <input type="text" id="room-input" placeholder="ACCESS CODE (4-DIGIT)" value="1010">
            <input type="text" id="url-input" placeholder="SOURCE URL" value="https://images.unsplash.com/photo-1635805737707-575885ab0820?w=500">
            <div class="btn-group">
                <button onclick="boot('sender')">INIT SENDER</button>
                <button onclick="boot('receiver')">INIT RECEIVER</button>
            </div>
            <p style="margin-top: 20px; font-size: 0.6rem; opacity: 0.5;">v2.4.0 // Spatial Transfer Handshake Protocol</p>
        </div>
    </div>

    <div id="main-interface">
        <video id="video-feed" playsinline></video>
        <canvas id="tracking-canvas"></canvas>
        <div class="overlay-layer">
            <div class="scanline"></div>
        </div>
        
        <div class="payload-wrapper">
            <img id="payload-img" src="" alt="AETHER_PAYLOAD">
        </div>

        <div class="status-tag" id="status-display">LINK_IDLE // WAITING_FOR_SYNC</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxc_mSE5Z-5vvLA8_8EOFuueERi8eY63U",
            authDomain: "tokji-3b05a.firebaseapp.com",
            databaseURL: "https://tokji-3b05a-default-rtdb.firebaseio.com",
            projectId: "tokji-3b05a",
            storageBucket: "tokji-3b05a.firebasestorage.app",
            messagingSenderId: "743789412997",
            appId: "1:743789412997:web:be9196bd3dd574ef879fec"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getDatabase(fApp);

        // --- APP STATE ---
        const state = {
            role: null,
            roomId: null,
            isFist: false,
            lastFistState: false,
            payloadReady: false,
            syncReady: false
        };

        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('tracking-canvas');
        const ctx = canvas.getContext('2d');
        const payloadImg = document.getElementById('payload-img');
        const statusDisplay = document.getElementById('status-display');

        window.boot = async (role) => {
            state.role = role;
            state.roomId = document.getElementById('room-input').value;
            const imgUrl = document.getElementById('url-input').value;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-interface').style.display = 'block';
            
            if (role === 'sender') {
                payloadImg.src = imgUrl;
                payloadImg.style.display = 'block';
                statusDisplay.innerText = "LINK_ACTIVE // GRAB TO TRANSFER";
                // Reset DB
                set(ref(db, `spatial/${state.roomId}`), { status: 'idle', url: imgUrl });
            }

            initCamera();
            initFirebase();
        };

        function initFirebase() {
            onValue(ref(db, `spatial/${state.roomId}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (state.role === 'receiver') {
                    if (data.status === 'ready') {
                        payloadImg.src = data.url;
                        state.payloadReady = true;
                        statusDisplay.innerText = "SIGNAL_DETECTED // PERFORM DROP GESTURE";
                    } else if (data.status === 'consumed') {
                        state.payloadReady = false;
                        statusDisplay.innerText = "TRANSFER_COMPLETE // STANDBY";
                    }
                }

                if (state.role === 'sender' && data.status === 'consumed') {
                    statusDisplay.innerText = "DISPATCHED_SUCCESSFULLY";
                    setTimeout(() => location.reload(), 3000);
                }
            });
        }

        async function initCamera() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults(processHands);

            const camera = new Camera(video, {
                onFrame: async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    await hands.send({image: video});
                },
                width: 1280,
                height: 720
            });
            camera.start();
        }

        function processHands(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Visual Tracking HUD
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00f2ff', lineWidth: 1});
                drawLandmarks(ctx, landmarks, {color: '#00f2ff', radius: 2});

                // Gesture Math
                const wrist = landmarks[0];
                const fingerTips = [8, 12, 16, 20];
                const fingerPips = [6, 10, 14, 18];
                
                let closedCount = 0;
                for(let i=0; i<4; i++) {
                    const tipDist = Math.hypot(landmarks[fingerTips[i]].x - wrist.x, landmarks[fingerTips[i]].y - wrist.y);
                    const pipDist = Math.hypot(landmarks[fingerPips[i]].x - wrist.x, landmarks[fingerPips[i]].y - wrist.y);
                    if (tipDist < pipDist) closedCount++;
                }

                state.isFist = closedCount >= 3;

                // Tracking coordinates
                const handX = (1 - landmarks[9].x) * window.innerWidth;
                const handY = landmarks[9].y * window.innerHeight;
                document.documentElement.style.setProperty('--hand-x', `${handX}px`);
                document.documentElement.style.setProperty('--hand-y', `${handY}px`);

                // SENDER LOGIC: If grabbed, hide and update DB
                if (state.role === 'sender' && state.isFist && !state.syncReady) {
                    state.syncReady = true;
                    payloadImg.style.display = 'none';
                    update(ref(db, `spatial/${state.roomId}`), { status: 'ready' });
                    statusDisplay.innerText = "UPLOADING_SIGNAL...";
                }

                // RECEIVER LOGIC: Detect Hand Transition (Fist -> Open)
                if (state.role === 'receiver' && state.payloadReady) {
                    if (state.lastFistState === true && state.isFist === false) {
                        // THE DROP
                        payloadImg.classList.add('animate-drop');
                        update(ref(db, `spatial/${state.roomId}`), { status: 'consumed' });
                        if ("vibrate" in navigator) navigator.vibrate([30, 50, 30]);
                    }
                }

                state.lastFistState = state.isFist;
            }
        }
    </script>
</body>
</html>
